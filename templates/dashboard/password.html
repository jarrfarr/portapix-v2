{% extends "base.html" %}
{% block title %}Change password · EventHub{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <h1>Change password</h1>
    {% if session and session.must_change_password %}
    <p class="warn">You must change the first-boot password before continuing.</p>
    {% endif %}
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/password">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label for="current">Current password</label>
      <input id="current" name="current_password" type="password" autocomplete="current-password" required>
      <label for="new">New password</label>
      <input id="new" name="new_password" type="password" autocomplete="new-password" required>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm_password" type="password" autocomplete="new-password" required>
      <div class="actions" style="margin-top:14px">
        <button class="primary" type="submit">Update password</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
